services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mirror
      POSTGRES_USER: mirror
      POSTGRES_PASSWORD: mirror
    ports:
      - "5432:5432"
    volumes:
      - mirror_postgres:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror -d mirror"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mirror_postgres:
